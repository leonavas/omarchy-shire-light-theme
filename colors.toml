# Shire — a hobbit-hole in the late afternoon.
#
# The same theme as Shire Night, an hour or two earlier: still dark, still
# loam and lamplight, but with daylight leaking in around the round door.
# Every color is the night palette lifted one gentle step — the earth a shade
# looser, the parchment a shade brighter, the pasture a touch more sunlit.
# Nothing changes hue; everything relaxes.
#
# Nothing here is fully saturated and nothing is pure black or pure white.
# That is the whole point: it should feel like second breakfast, not a cockpit.

mode = "dark"

# sunlit pasture — borders, cursor, selected text
accent = "#A3C46E"
# grass in shadow
selection = "#3C4A31"
# hedgerow
muted = "#687A53"

# loam under the Hill, daylight leaking in
background = "#20261A"
# deeper earth
dark_background = "#191E14"
# root cellar
darker_background = "#12160D"
# turned soil
lighter_background = "#2B3220"

# sunlit parchment
foreground = "#EAE2C9"
# linen
light_foreground = "#CDC4A8"
# dim moss — comments, inactive text
dark_foreground = "#7A8266"
# candleflame
bright_foreground = "#F8F2DE"

# grass into lamplight
hyprland_active_border = "rgba(a3c46eee) rgba(e0b44fee) 45deg"
hyprland_inactive_border = "rgba(46523aaa)"

active_border_color = "#EAE2C9"
active_tab_background = "#48563B"

# chimney brick
red = "#CC7058"
# brass lantern
yellow = "#E0B44F"
# pipeweed ember
orange = "#D68F50"
# pasture
green = "#9CBF68"
# The Water
cyan = "#8DB497"
# Shire sky
blue = "#8BA9BC"
# elderberry
magenta = "#B490AB"
# oak beam
brown = "#8A6A48"

bright_red = "#E48F74"
bright_yellow = "#F1CF7E"
bright_green = "#B8D988"
bright_cyan = "#ABD0B3"
bright_blue = "#ACC9D9"
bright_magenta = "#D2B2C9"
